<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

        :root {
            --bg: #0b0f19;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #4f46e5;
            --primary-hover: #6366f1;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --card-bg: rgba(30, 41, 59, 0.6);
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: radial-gradient(circle at top left, #1e1b4b, var(--bg) 50%);
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; animation: fadeIn 0.6s ease-out; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 30px; 
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border); 
            border-radius: 16px;
            margin-bottom: 40px; 
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
        }
        header h2 { font-weight: 700; background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        
        nav a { 
            color: var(--text-muted); text-decoration: none; margin-left: 25px; 
            font-weight: 500; transition: all 0.3s ease; 
        }
        nav a:hover { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
        
        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            padding: 25px; 
            border-radius: 16px; 
            border: 1px solid var(--border); 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3); }
        
        input, select, textarea { 
            width: 100%; padding: 12px 16px; margin-bottom: 15px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid var(--border); color: var(--text); 
            border-radius: 8px; font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
            background: rgba(15, 23, 42, 0.9);
        }
        
        button { 
            background: linear-gradient(135deg, var(--primary), #818cf8); 
            color: white; border: none; padding: 12px 24px; 
            border-radius: 8px; font-weight: 600; cursor: pointer; 
            transition: all 0.3s ease; font-family: 'Outfit', sans-serif;
            box-shadow: 0 4px 15px var(--primary-glow);
        }
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px var(--primary-glow);
            background: linear-gradient(135deg, var(--primary-hover), #a5b4fc);
        }
        button:active { transform: translateY(1px); }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; }
        th, td { text-align: left; padding: 16px; border-bottom: 1px solid var(--border); }
        th { color: #94a3b8; font-weight: 500; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        tr { transition: background 0.2s ease; }
        tbody tr:hover { background: rgba(255, 255, 255, 0.03); }
        
        .hidden { display: none !important; }
        .flex { display: flex; gap: 15px; flex-wrap: wrap; }
        
        h2, h3 { margin-bottom: 15px; font-weight: 600; letter-spacing: -0.5px; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        const API_URL = '/api';
        
        function getAuthHeaders() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login/';
                return {};
            }
            return {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            };
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('user_role');
            window.location.href = '/login/';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const path = window.location.pathname;
            if (path !== '/login/' && path !== '/signup/') {
                if (!localStorage.getItem('access_token')) {
                    window.location.href = '/login/';
                } else {
                    document.getElementById('header').classList.remove('hidden');
                }
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <header id="header" class="hidden">
            <h2>Team Task Manager</h2>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/projects/">Projects</a>
                <a href="/tasks/">Tasks</a>
                <a href="#" onclick="logout()">Logout</a>
            </nav>
        </header>
        <div id="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
