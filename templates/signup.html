{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <h2 style="margin-bottom: 20px;">Sign Up</h2>
    <form id="signupForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" style="width: 100%;">Sign Up</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">Already have an account? <a href="/login/" style="color: var(--primary);">Login</a></p>
    <div id="error" style="color: var(--danger); margin-top: 10px; display: none;"></div>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');
        
        try {
            const res = await fetch(API_URL + '/signup/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role: 'member' })
            });
            if (res.ok) {
                window.location.href = '/login/';
            } else {
                const data = await res.json();
                errorDiv.innerText = JSON.stringify(data);
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.innerText = 'An error occurred';
            errorDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
