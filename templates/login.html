{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 50px auto;">
    <h2 style="margin-bottom: 20px;">Login</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" style="width: 100%;">Login</button>
    </form>
    <p style="margin-top: 15px; text-align: center;">Don't have an account? <a href="/signup/" style="color: var(--primary);">Sign up</a></p>
    <div id="error" style="color: var(--danger); margin-top: 10px; display: none;"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');
        
        try {
            const res = await fetch(API_URL + '/login/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('user_role', data.role);
                localStorage.setItem('user_name', data.name);
                window.location.href = '/';
            } else {
                errorDiv.innerText = 'Invalid credentials';
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            errorDiv.innerText = 'An error occurred';
            errorDiv.style.display = 'block';
        }
    });
</script>
{% endblock %}
